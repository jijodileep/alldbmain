<VirtualHost *:80>
    ServerName mysql-manager.example.com
    DocumentRoot /var/www/mysql-manager

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # API and SignalR stay on the local Kestrel process.
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    ProxyPass /hubs/ http://127.0.0.1:8080/hubs/ upgrade=websocket
    ProxyPassReverse /hubs/ http://127.0.0.1:8080/hubs/

    <Directory /var/www/mysql-manager>
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/mysql-manager-error.log
    CustomLog ${APACHE_LOG_DIR}/mysql-manager-access.log combined
</VirtualHost>
